services:
  xmltv:
    image: ghcr.io/polographer/schedules-direct-update-and-serve:latest
    environment:
      - TZ=America/New_York
    container_name: xmltv
    ports:
      - "51969:80"
    volumes:
      - xmltv_data:/var/www/html
      - xmltv_config:/root/.xmltv
    restart: unless-stopped

volumes:
  xmltv_data:
    name: xmltv_data
  xmltv_config:
    name: xmltv_config
